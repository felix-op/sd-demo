# sdist1: microservicio prestamos y su base de datos Postgres
services:
  prestamos-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prestamos
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5100:5432"
    volumes:
      - prestamos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d prestamos"]
      interval: 5s
      timeout: 5s
      retries: 10

  prestamos:
    image: felixop/sdprestamos:latest
    restart: unless-stopped
    depends_on:
      prestamos-db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://prestamos-db:5432/prestamos
      QUARKUS_DATASOURCE_USERNAME: demo
      QUARKUS_DATASOURCE_PASSWORD: demo
    ports:
      - "8200:8200"
      
volumes:
  prestamos-data:
