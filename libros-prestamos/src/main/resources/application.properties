quarkus.http.port=8200
quarkus.http.test-port=8201
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=demo
quarkus.datasource.password=demo
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.schema-management.strategy=update

# mvn quarkus:dev corre en el host, contra la base levantada por docker compose (puerto 5200)
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5200/libros
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Cliente REST hacia personas (en dev usa localhost:8100, en contenedores se sobreescribe con QUARKUS_REST_CLIENT_PERSONAS_API_URL)
quarkus.rest-client.personas-api.url=http://localhost:8100
