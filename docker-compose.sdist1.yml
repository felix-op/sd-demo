# sdist1: microservicio personas y su base de datos Postgres
services:
  personas-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: personas
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5100:5432"
    volumes:
      - personas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d personas"]
      interval: 5s
      timeout: 5s
      retries: 10

  personas:
    image: felixop/sdpersonas:latest
    restart: unless-stopped
    depends_on:
      personas-db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://personas-db:5432/personas
      QUARKUS_DATASOURCE_USERNAME: demo
      QUARKUS_DATASOURCE_PASSWORD: demo
    ports:
      - "8100:8100"

volumes:
  personas-data:
