quarkus.http.port=8100
quarkus.http.test-port=8101
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=demo
quarkus.datasource.password=demo
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.schema-management.strategy=update

# mvn quarkus:dev corre en el host, contra la base levantada por docker compose.
# En docker compose la URL llega por QUARKUS_DATASOURCE_JDBC_URL; en test, Dev Services.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5100/personas
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
