# Requiere haber corrido "./mvnw package" en cada servicio antes del build.
services:
  personas-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personas
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5100:5432"
    volumes:
      - personas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d personas"]
      interval: 5s
      retries: 10

  personas:
    image: felixop/sdpersonas:latest
    build: ./personas
    depends_on:
      personas-db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://personas-db:5432/personas
    ports:
      - "8100:8100"

  libros-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: libros
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5200:5432"
    volumes:
      - libros-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d libros"]
      interval: 5s
      retries: 10

  libros-prestamos:
    build: ./libros-prestamos
    depends_on:
      libros-db:
        condition: service_healthy
      personas:
        condition: service_started
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://libros-db:5432/libros
      QUARKUS_REST_CLIENT_PERSONAS_API_URL: http://personas:8100
    ports:
      - "8200:8200"

volumes:
  personas-data:
  libros-data:
