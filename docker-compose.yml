# Requiere haber corrido "./mvnw package" en cada servicio antes del build.
services:
  personas-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personas
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5100:5432"
    volumes:
      - personas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d personas"]
      interval: 5s
      retries: 10

  personas:
    build: ./personas
    depends_on:
      personas-db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://personas-db:5432/personas
    ports:
      - "8100:8100"

volumes:
  personas-data:
