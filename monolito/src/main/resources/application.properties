# Desarrollo: Postgres persistente via docker-compose.dev.yml (no Dev Services)
# Credenciales desde .env (ver .env.example) - Quarkus lo carga solo en modo dev
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Desarrollo: host "localhost" porque mvn quarkus:dev corre en el host, no en un contenedor
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB}
%dev.quarkus.datasource.username=${POSTGRES_USER}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD}
%dev.quarkus.hibernate-orm.schema-management.strategy=update

# Produccion: jdbc.url/username/password NO van aca a proposito, vienen
# como variables de entorno del contenedor "app" en docker-compose.production.yml

# Servidor HTTP
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.test-port=8081
quarkus.http.root-path=/

# CORS: se permite cualquier origen.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
